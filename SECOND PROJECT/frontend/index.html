<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeLens AI — Personal Trading Intelligence Platform</title>
  
  <!-- Favicon / Meta -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%22><text y=%2226%22 font-size=%2224%22>⚡</text></svg>">
  <meta name="description" content="Personal Trading Intelligence Platform for Indian stock and F&O traders. Understand your real trading performance, friction costs, and behavioral leaks.">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            },
            dark: {
              bg: '#0a0e17',
              card: '#111827',
              border: '#1f293d',
              hover: '#1b2438'
            },
            profit: {
              light: '#34d399',
              DEFAULT: '#10b981',
              dark: '#059669',
              glow: 'rgba(16, 185, 129, 0.15)'
            },
            loss: {
              light: '#fb7185',
              DEFAULT: '#f43f5e',
              dark: '#e11d48',
              glow: 'rgba(244, 63, 94, 0.15)'
            }
          },
          fontFamily: {
            mono: ['"JetBrains Mono"', 'monospace', 'Consolas'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Custom CSS -->
  <link rel="stylesheet" href="/static/styles.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel for JSX Execution in Browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0a0e17] text-slate-100 min-h-screen selection:bg-blue-600 selection:text-white">
  <div id="root">
    <!-- Instant Fallback Loading State -->
    <div class="flex items-center justify-center min-h-screen">
      <div class="text-center">
        <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <h2 class="text-xl font-semibold text-slate-200">Initializing TradeLens AI</h2>
        <p class="text-sm text-slate-400 mt-1">Bootstrapping personal trading intelligence terminal...</p>
      </div>
    </div>
  </div>

  <!-- Main React Application Script -->
  <script type="text/babel" src="/static/app.js"></script>
</body>
</html>
